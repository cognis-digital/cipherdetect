apiVersion: apps/v1
kind: Deployment
metadata: { name: cipherdetect, labels: { app: cipherdetect } }
spec:
  replicas: 1
  selector: { matchLabels: { app: cipherdetect } }
  template:
    metadata: { labels: { app: cipherdetect } }
    spec:
      containers:
        - name: cipherdetect
          image: ghcr.io/cognis-digital/cipherdetect:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: cipherdetect }
spec:
  selector: { app: cipherdetect }
  ports: [{ port: 80, targetPort: 8000 }]
